# ── DEPLOYMENT ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-two
  namespace: default
  labels:
    app: app-two
spec:
  replicas:
    3       # ← the key difference for app2
            # 3 Pods always running
            # if one crashes → immediately replaced
            # kubectl get pods will show 3 app-two-xxx pods

  selector:
    matchLabels:
      app: app-two

  template:
    metadata:
      labels:
        app: app-two
    spec:
      containers:
        - name: app-two
          image: paulbouwer/hello-kubernetes:1.10
          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE
              value: "Hello from App 2"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

---
# ── SERVICE ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: app-two-svc
  namespace: default
spec:
  selector:
    app:
      app-two # finds all 3 app-two Pods
              # automatically load-balances between them
  ports:
    - port: 80
      targetPort: 8080
