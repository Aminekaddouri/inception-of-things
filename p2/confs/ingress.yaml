apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: default
spec:
  ingressClassName: traefik

  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-one-svc
                port:
                  number: 80

    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-two-svc
                port:
                  number: 80

    # Catch-all: no host specified = matches ANY request that didn't
    # match app1.com or app2.com, including bare IP requests
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-three-svc
                port:
                  number: 80
