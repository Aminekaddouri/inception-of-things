# ── DEPLOYMENT ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-three
  namespace: default
  labels:
    app: app-three
spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-three

  template:
    metadata:
      labels:
        app: app-three
    spec:
      containers:
        - name: app-three
          image: paulbouwer/hello-kubernetes:1.10
          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE
              value: "Hello from App 3 - Default"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

---
# ── SERVICE ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: app-three-svc
  namespace: default
spec:
  selector:
    app: app-three
  ports:
    - port: 80
      targetPort: 8080
