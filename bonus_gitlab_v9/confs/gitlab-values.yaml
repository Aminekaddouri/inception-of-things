# GitLab Helm chart 9.11.8 (GitLab CE v18.11.6), trimmed down to run inside a local K3d cluster.
# Web UI: http://gitlab.local (K3d load balancer port 80 -> Traefik -> GitLab ingress)

installCertmanager: false

global:
  edition: ce
  hosts:
    domain: local          # GitLab is served on gitlab.local
    https: false
  ingress:
    class: traefik         # K3d ships Traefik as its Ingress controller
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false         # GitLab agent for Kubernetes is not needed (Argo CD does the deploys)

# Components we do not need for this lab
nginx-ingress:
  enabled: false

gitlab-runner:
  install: false

prometheus:
  install: false

registry:
  enabled: false

gitlab:
  gitaly:
    resources: { requests: { cpu: 100m, memory: 256Mi } }
  webservice:
    resources: { requests: { cpu: 300m, memory: 800Mi } }
    minReplicas: 1
    maxReplicas: 1
  sidekiq:
    resources: { requests: { cpu: 100m, memory: 500Mi } }
    minReplicas: 1
    maxReplicas: 1
  toolbox:
    resources: { requests: { cpu: 50m, memory: 200Mi } }
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  gitlab-exporter:
    enabled: false

postgresql:
  resources: { requests: { cpu: 100m, memory: 256Mi } }

redis:
  resources: { requests: { cpu: 50m, memory: 100Mi } }

minio:
  resources: { requests: { cpu: 50m, memory: 100Mi } }
