# ── GLOBAL SETTINGS ──────────────────────────────────────────────────────────
global:

  # Edition: Community Edition (free, open source)
  # Enterprise Edition has paid features we don't need
  edition: ce

  hosts:
    # The domain GitLab will use internally
    # We use a fake local domain — no real DNS needed
    domain: gitlab.local

    # No HTTPS — SSL certificates are complex to set up locally
    # and not required for this project
    https: false

    gitlab:
      name: gitlab.local
      https: false

  # Ingress settings — we disable GitLab's own ingress
  # K3d already has Traefik as ingress controller
  # We'll access GitLab via port-forward instead
  ingress:
    enabled: false
    configureCertmanager: false

  # GitLab uses object storage (like S3) for uploads, artifacts, etc.
  # Minio is a local S3-compatible server that comes with GitLab chart
  appConfig:
    object_store:
      enabled: true
      proxy_download: true

  # Service type for GitLab's webservice
  # ClusterIP = only accessible inside the cluster
  # We'll use port-forward to access from outside
  service:
    type: ClusterIP

# ── DISABLE COMPONENTS WE DON'T NEED ─────────────────────────────────────────

# cert-manager: manages SSL certificates
# We don't need SSL for local development
certmanager:
  install: false

# nginx-ingress: GitLab's bundled nginx
# K3d already has Traefik — we don't need two ingress controllers
nginx-ingress:
  enabled: false

# Prometheus: monitoring and metrics
# Nice to have but heavy — disable for this project
prometheus:
  install: false

# GitLab Runner: executes CI/CD pipelines
# We're not running pipelines — Argo CD does our deployments
gitlab-runner:
  install: false

# Container Registry: stores Docker images
# We're pulling from Docker Hub — don't need local registry
registry:
  enabled: false

# ── GITLAB COMPONENTS — MINIMAL RESOURCES ────────────────────────────────────
# Each component gets the minimum resources it needs
# Without these limits, Helm would request more than our VM has

gitlab:

  # Webservice: the main GitLab web UI and API
  # This is what you see when you open GitLab in a browser
  webservice:
    minReplicas: 1
    maxReplicas: 1      # only 1 instance — saves RAM
    resources:
      requests:
        cpu: "100m"     # 0.1 CPU core minimum
        memory: "1G"    # 1GB minimum for Rails app

  # Sidekiq: background job processor
  # Handles emails, notifications, repository imports, etc.
  sidekiq:
    resources:
      requests:
        cpu: "50m"
        memory: "625M"

  # Gitaly: manages git repository storage
  # Every git push/pull goes through Gitaly
  gitaly:
    persistence:
      enabled: true
      size: 5Gi         # 5GB for git repos — enough for our project
      storageClass: local-path   # K3d's built-in storage class
    resources:
      requests:
        cpu: "50m"
        memory: "200M"

  # GitLab Shell: handles SSH git operations
  # We'll use HTTP not SSH, but it's required by the chart
  gitlab-shell:
    resources:
      requests:
        cpu: "10m"
        memory: "20M"

  # Toolbox: backup/restore and administrative tasks
  toolbox:
    resources:
      requests:
        cpu: "50m"
        memory: "100M"

  # Migrations: runs database migrations on startup
  migrations:
    resources:
      requests:
        cpu: "50m"
        memory: "200M"

# ── POSTGRESQL ────────────────────────────────────────────────────────────────
# GitLab's database — stores users, projects, issues, etc.
postgresql:
  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: local-path
    resources:
      requests:
        cpu: "50m"
        memory: "200M"

# ── REDIS ─────────────────────────────────────────────────────────────────────
# Cache and job queue
redis:
  master:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: "50m"
        memory: "64M"

# ── MINIO ─────────────────────────────────────────────────────────────────────
# Local S3-compatible object storage
# Stores GitLab uploads, CI artifacts, backups
minio:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: "10m"
      memory: "128M"